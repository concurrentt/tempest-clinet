# Builds Tempest on every push, and publishes a GitHub Release with the jar when you push a version tag (v0.17.3).
name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      # On a version tag (v0.18.0) the jar is stamped with that version, so the in-game updater
      # always sees the same number as the release. Other builds use mod_version from gradle.properties.
      - name: Build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gradle build --no-daemon -Pmod_version="${GITHUB_REF_NAME#v}"
          else
            gradle build --no-daemon
          fi

      - name: Keep only the mod jar
        run: rm -f build/libs/*-sources.jar

      - name: Upload jar (every build)
        uses: actions/upload-artifact@v4
        with:
          name: tempest
          path: build/libs/*.jar

      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
